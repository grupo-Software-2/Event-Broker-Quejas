spring.application.name=Event-Broker-Quejas
server.port=8082
# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ============================================
# ASYNC TASK EXECUTION PATTERN CONFIGURATION
# ============================================
# Event Distribution Executor
async.event-distribution.core-size=5
async.event-distribution.max-size=20
async.event-distribution.queue-capacity=500
# Subscriber Notification Executor
async.subscriber-notification.core-size=10
async.subscriber-notification.max-size=50
async.subscriber-notification.queue-capacity=1000
# Event Processing Executor
async.event-processing.core-size=3
async.event-processing.max-size=10
async.event-processing.queue-capacity=200
# Task Executor (Default)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=15
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-task-
# Shutdown Configuration
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s
# ============================================
# MONITORING CONFIGURATION
# ============================================
# Scheduler para monitoreo de pools
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-
# Logging
logging.level.com.uptc.event_broker=INFO
logging.level.com.uptc.event_broker.service=DEBUG
logging.level.com.uptc.event_broker.monitor=INFO
logging.level.org.springframework.scheduling=INFO
logging.level.org.springframework.web=INFO